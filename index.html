<!DOCTYPE html>
<html lang="en" data-tile-theme="topdown">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plannera ditt eget Sydöstra Uppsala!</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        (function () {
            var saved = localStorage.getItem('sim-se-tile-theme');
            if (saved) document.documentElement.dataset.tileTheme = saved;
        })();
    </script>
</head>
<body>
    <header class="game-header">
        <h1>Planera Sydöstra Uppsala</h1>
        <div class="header-controls">
            <div class="theme-select-wrap">
                <label class="theme-select-label" for="tile-theme-select">Rututseende</label>
                <select id="tile-theme-select" class="theme-select" aria-label="Välj hur rutorna visas">
                    <option value="illustrated">Illustrerade</option>
                    <option value="flat">Platta färger</option>
                    <option value="simcity">SimCity-retro</option>
                    <option value="topdown">Top down</option>
                    <option value="sunset">Sunset</option>
                </select>
            </div>
            <div class="stats-panel">
                <span class="stat-label">Antal nya bostäder:</span>
                <span class="stat-value" id="total-dwellings">0</span>
            </div>
        </div>
    </header>

    <section class="info-indicators" aria-label="Planeringsindikatorer">
        <div class="info-indicators__group">
        <button
            type="button"
            class="info-indicator info-indicator--ok"
            id="indicator-gronska"
        >
            Grönska (3-30-300)
        </button>
        <button
            type="button"
            class="info-indicator info-indicator--fail"
            id="indicator-fyrsparsavtalet"
        >
            Fyrspårsavtalet
        </button>
        <button
            type="button"
            class="info-indicator info-indicator--stat"
            id="indicator-stationsnara"
            aria-live="polite"
        >
            <span class="info-indicator__label">Stationsnära bostäder</span>
            <span class="info-indicator__value">
                <span id="stationsnara-count">0</span><span class="info-indicator__comparison" id="stationsnara-comparison"></span>
            </span>
        </button>
        <button
            type="button"
            class="info-indicator info-indicator--labeled info-indicator--ok"
            id="indicator-trafiklage"
            aria-live="polite"
        >
            <span class="info-indicator__label">Trafikläge</span>
            <span class="info-indicator__value" id="trafiklage-status">Trafiken flyter på</span>
        </button>
        </div>

        <div class="info-indicators__controls">
            <div class="planning-flipper">
                <span class="planning-flipper__label">Boulevard</span>
                <div
                    class="segment-flipper"
                    id="boulevard-flipper"
                    role="radiogroup"
                    aria-label="Boulevard"
                >
                    <button
                        type="button"
                        class="segment-flipper__option segment-flipper__option--active"
                        role="radio"
                        aria-checked="true"
                        data-mode="rak"
                    >
                        Rak
                    </button>
                    <button
                        type="button"
                        class="segment-flipper__option"
                        role="radio"
                        aria-checked="false"
                        data-mode="bruten"
                    >
                        Bruten
                    </button>
                </div>
            </div>

            <div class="planning-flipper">
                <span class="planning-flipper__label">Kollektivtrafik</span>
                <div
                    class="segment-flipper"
                    id="kollektivtrafik-flipper"
                    role="radiogroup"
                    aria-label="Kollektivtrafik"
                >
                    <button
                        type="button"
                        class="segment-flipper__option segment-flipper__option--active"
                        role="radio"
                        aria-checked="true"
                        data-mode="buss"
                    >
                        Buss
                    </button>
                    <button
                        type="button"
                        class="segment-flipper__option"
                        role="radio"
                        aria-checked="false"
                        data-mode="brt"
                    >
                        BRT
                    </button>
                    <button
                        type="button"
                        class="segment-flipper__option"
                        role="radio"
                        aria-checked="false"
                        data-mode="sparvagn"
                    >
                        Spårvagn
                    </button>
                </div>
            </div>
        </div>
    </section>

    <main class="game-container">
        <!-- Verktyg -->
        <aside class="toolbar" id="toolbar">
            <h2>Verktyg</h2>
            <div id="tools-container"></div>
        </aside>

        <!-- Game Board -->
        <section class="board-wrapper">
            <!-- Borders -->
            <div class="border border-north">
                <span class="border-label label-nw">Sävja</span>
                <span class="border-label label-ne">Bergsbrunna</span>
            </div>
            <div class="border border-south"><span class="border-label">Lunsens naturreservat</span></div>
            
            <!-- The Grid -->
            <div id="game-grid" class="game-grid">
                <!-- Road (West Border) -->
                <div class="road-container">
                    <div class="road-track"></div>
                    <span class="label-road-text">Väg 255</span>
                </div>
                
                <!-- Railroad (East Border) -->
                <div class="railroad-container">
                    <span class="border-label label-railway">Järnväg</span>
                    <div class="railroad-track"></div>
                    <div class="station-building">Station</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Custom tooltip -->
    <div id="cell-tooltip" class="cell-tooltip"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
