<!DOCTYPE html>
<html lang="en" data-tile-theme="illustrated">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sydöstra Uppsala City Builder</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        (function () {
            var saved = localStorage.getItem('sim-se-tile-theme');
            if (saved) document.documentElement.dataset.tileTheme = saved;
        })();
    </script>
</head>
<body>
    <header class="game-header">
        <h1>Sydöstra Uppsala Planner</h1>
        <div class="header-controls">
            <div class="theme-select-wrap">
                <label class="theme-select-label" for="tile-theme-select">Rututseende</label>
                <select id="tile-theme-select" class="theme-select" aria-label="Välj hur rutorna visas">
                    <option value="illustrated">Illustrerade</option>
                    <option value="flat">Platta färger</option>
                    <option value="simcity">SimCity-retro</option>
                    <option value="topdown">Top down</option>
                </select>
            </div>
            <div class="stats-panel">
                <span class="stat-label">Antal nya bostäder:</span>
                <span class="stat-value" id="total-dwellings">0</span>
            </div>
        </div>
    </header>

    <main class="game-container">
        <!-- Toolbar for Zoning -->
        <aside class="toolbar" id="toolbar">
            <h2>Zoning Tools</h2>
            <div id="tools-container"></div>
        </aside>

        <!-- Game Board -->
        <section class="board-wrapper">
            <!-- Borders -->
            <div class="border border-north">
                <span class="border-label label-nw">Sävja</span>
                <span class="border-label label-ne">Bergsbrunna</span>
            </div>
            <div class="border border-south"><span class="border-label">Lunsens naturreservat</span></div>
            
            <!-- The Grid -->
            <div id="game-grid" class="game-grid">
                <!-- Road (West Border) -->
                <div class="road-container">
                    <div class="road-track"></div>
                    <span class="label-road-text">Väg 255</span>
                </div>
                
                <!-- Railroad (East Border) -->
                <div class="railroad-container">
                    <span class="border-label label-railway">Järnväg</span>
                    <div class="railroad-track"></div>
                    <div class="station-building">Station</div>
                </div>
            </div>
        </section>
    </main>

    <section class="congestion-meter" id="congestion-meter" aria-label="Boulevardens transportkapacitet">
        <div class="congestion-meter__header">
            <span class="congestion-meter__title">Boulevardens kapacitet</span>
            <span class="congestion-meter__range">0 – 25&nbsp;000 bostäder</span>
        </div>
        <div class="congestion-track-outer">
            <div class="congestion-track" id="congestion-track">
                <div class="congestion-zone congestion-zone--green" id="zone-sweet" data-zone="sweet">
                    <span class="congestion-zone__badge">Den gyllene medelvägen</span>
                    <span class="congestion-zone__label">Cykel, Bil &amp; Vanlig Buss</span>
                </div>
                <div class="congestion-zone congestion-zone--bilvagg congestion-zone--dormant" id="zone-bilvagg" data-zone="bilvagg">
                    <span class="congestion-zone__lock" aria-hidden="true">🔒</span>
                    <span class="congestion-zone__label">Bilväggen nådd</span>
                </div>
                <div class="congestion-zone congestion-zone--kollektivvagg congestion-zone--dormant" id="zone-kollektivvagg" data-zone="kollektivvagg">
                    <span class="congestion-zone__lock" aria-hidden="true">🔒</span>
                    <span class="congestion-zone__label">Kollektivväggen nådd!</span>
                </div>
                <div class="congestion-indicator" id="congestion-indicator" aria-hidden="true">
                    <svg class="congestion-indicator__arrow" viewBox="0 0 28 38" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 38 L4 26 L9 26 L9 2 C9 1 10 0 11 0 L17 0 C18 0 19 1 19 2 L19 26 L24 26 Z" fill="#ffcc00" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>
                        <circle cx="14" cy="13" r="4" fill="#1a1a1a"/>
                    </svg>
                </div>
            </div>
            <div class="congestion-ticks">
                <span>0</span>
                <span>12&nbsp;000</span>
                <span>18&nbsp;000</span>
                <span>21&nbsp;000</span>
                <span>25&nbsp;000</span>
            </div>
        </div>
    </section>

    <!-- Custom tooltip -->
    <div id="cell-tooltip" class="cell-tooltip"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
